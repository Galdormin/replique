[package]
name = "bevy_replique_derive"
description = "Derive macros for bevy_replique, the Bevy plugin of the Replique dialogue system"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["bevy", "dialogue", "narrative", "gamedev", "macro"]
categories = ["game-development"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
bevy_replique = { path = "../bevy_replique" }
bevy = { workspace = true }
