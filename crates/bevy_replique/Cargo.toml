[package]
name = "bevy_replique"
description = "Bevy plugin for Replique, a pure rust dialogue manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["bevy", "dialogue", "narrative", "gamedev", "yarnspinner"]
categories = ["game-development"]
readme = "../../README.md"

[dependencies]
replique = { workspace = true }
bevy_replique_derive = { workspace = true }

bevy = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# `system_font_discovery` gives the examples the bold and italic faces of the
# system fonts, which the font Bevy embeds does not have.
bevy = { version = "0.20", default-features = false, features = [
    "ui",
    "2d",
    "system_font_discovery",
] }
