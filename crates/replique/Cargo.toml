[package]
name = "replique"
description = "A pure Rust dialogue system"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["dialogue", "narrative", "gamedev", "yarnspinner", "parser"]
categories = ["game-development", "parser-implementations"]
readme = "../../README.md"

[dependencies]
thiserror = { workspace = true }
logos = "0.16"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
insta = "1.48"
proptest = "1.11"
