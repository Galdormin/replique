[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Galdormin/replique"
authors = ["Théo Plénet <theo.plenet@gmail.com>"]

[workspace.dependencies]
replique = { version = "0.0.0", path = "crates/replique" }
bevy_replique_derive = { path = "crates/bevy_replique_derive" }

bevy = { version = "0.19", default-features = false , features = ["bevy_asset", "bevy_log"] }
thiserror = "2"


[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
incremental = false
codegen-units = 256
